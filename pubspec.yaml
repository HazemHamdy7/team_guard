name: team_guard
description: Custom lint plugin to block forbidden Flutter widgets across team projects.
version: 1.0.18
repository: https://github.com/HazemHamdy7/team_guard

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  analyzer: ">=8.4.0 <12.0.0"
  analyzer_plugin: ">=0.13.0 <0.15.0"
  custom_lint: ^0.8.1
  custom_lint_builder: ^0.8.1
  yaml: ^3.1.2

dev_dependencies:
  lints: ^5.1.1
  test: ^1.25.0

executables:
  team_guard: team_guard
  check: check
  migrate: migrate
  doctor: doctor
  init: init
  setup: setup
